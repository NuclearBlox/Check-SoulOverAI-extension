name: Is the code soundproof? (bu bum tss)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Validate manifest.json syntax
        run: python3 -m json.tool manifest.json > /dev/null

      - name: Check required extension assets exist
        run: |
          python3 -c "
          import os, json
          manifest = json.load(open('manifest.json'))
          for icon in manifest.get('icons', {}).values():
              assert os.path.exists(icon), f'Missing icon: {icon}'
          bg = manifest.get('background', {}).get('service_worker')
          if bg:
              assert os.path.exists(bg), f'Missing background script: {bg}'
          print('All manifest asset paths exist.')
          "

  check-js-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Check JavaScript syntax errors
        run: find . -maxdepth 2 -name "*.js" -exec node --check {} \;

  test-skip-logic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Run processCurrentSong execution & skip tests
        run: |
          node -e "
          const fs = require('fs');

          // 1. STRUCTURAL CHECK: Ensure active skip command isn't commented out
          const rawScript = fs.readFileSync('Utils/processCurrentSong.js', 'utf8');
          const activeCode = rawScript.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*/g, '');
          console.assert(
            activeCode.includes('skipElement.click()'),
            'CRITICAL FAIL: skipElement.click() is commented out or missing from processCurrentSong.js!'
          );

          // 2. MOCK ENVIRONMENT SETUP
          let mockStorage = { minVotes: 3, threshold: 50 };
          global.chrome = {
            storage: {
              local: {
                get: async (key) => typeof key === 'string' ? { [key]: mockStorage[key] } : mockStorage
              }
            }
          };

          global.window = {};
          let fakeSkipClicked = false;
          const fakeSkipElement = { click: () => { fakeSkipClicked = true; } };

          global.document = {
            querySelectorAll: (selector) => [{ textContent: 'Test Artist', dataset: { soundproofId: 'test_handle' } }],
            querySelector: (selector) => ({ textContent: 'Test Artist', dataset: {} })
          };

          global.ShowWarningBadge = () => 'warning-badge';
          global.ShowHumanBadge = () => 'human-badge';
          global.ShowNoDataBadge = () => 'nodata-badge';

          // Load processCurrentSong
          eval(rawScript);

          async function runTests() {
            global.getLocalStatus = async () => null;

            // TEST 1: Below threshold (40% AI pull vs 50% threshold) -> NO SKIP
            global.getArtistStatus = async () => ({ out_ai: 4, out_human: 6, out_verified: false });
            fakeSkipClicked = false;
            await window.DecideBadge(10, 10, 'selector', 'loc', fakeSkipElement, 0, 'youtube');
            console.assert(fakeSkipClicked === false, 'Test 1 Failed: Should not skip below threshold');

            // TEST 2: Above threshold (80% AI pull vs 50% threshold) -> SHOULD SKIP
            global.getArtistStatus = async () => ({ out_ai: 8, out_human: 2, out_verified: false });
            fakeSkipClicked = false;
            await window.DecideBadge(10, 10, 'selector', 'loc', fakeSkipElement, 0, 'youtube');
            console.assert(fakeSkipClicked === true, 'Test 2 Failed: Should skip above threshold');

            // TEST 3: Total votes (2) < minVotes (3) -> NO SKIP
            global.getArtistStatus = async () => ({ out_ai: 2, out_human: 0, out_verified: false });
            fakeSkipClicked = false;
            await window.DecideBadge(10, 10, 'selector', 'loc', fakeSkipElement, 0, 'youtube');
            console.assert(fakeSkipClicked === false, 'Test 3 Failed: Should not skip when total votes < minVotes');

            // TEST 4: Whitelisted artist ('white') -> NO SKIP
            global.getArtistStatus = async () => ({ out_ai: 10, out_human: 0, out_verified: false });
            global.getLocalStatus = async () => 'white';
            fakeSkipClicked = false;
            await window.DecideBadge(10, 10, 'selector', 'loc', fakeSkipElement, 0, 'youtube');
            console.assert(fakeSkipClicked === false, 'Test 4 Failed: Whitelisted artist should never skip');

            // TEST 5: Blacklisted artist ('black') -> SHOULD SKIP
            global.getArtistStatus = async () => ({ out_ai: 0, out_human: 0, out_verified: false });
            global.getLocalStatus = async () => 'black';
            fakeSkipClicked = false;
            await window.DecideBadge(10, 10, 'selector', 'loc', fakeSkipElement, 0, 'youtube');
            console.assert(fakeSkipClicked === true, 'Test 5 Failed: Blacklisted artist should always skip');

            console.log('All processCurrentSong skipping tests passed successfully!');
          }

          runTests();
          "
