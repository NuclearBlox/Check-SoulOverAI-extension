name: SoundProof Extension Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Validate manifest.json syntax
        run: python3 -m json.tool manifest.json > /dev/null

      - name: Check required extension assets exist
        run: |
          python3 -c "
          import os, json
          manifest = json.load(open('manifest.json'))
          for icon in manifest.get('icons', {}).values():
              assert os.path.exists(icon), f'Missing icon: {icon}'
          bg = manifest.get('background', {}).get('service_worker')
          if bg:
              assert os.path.exists(bg), f'Missing background script: {bg}'
          print('All manifest asset paths exist.')
          "

  check-js-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Check JavaScript syntax errors
        run: find . -maxdepth 2 -name "*.js" -exec node --check {} \;

  test-skip-logic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Test DecideBadge skip logic
        run: |
          node -e "
          let mockStorage = { minVotes: 3, threshold: 50 };
          global.chrome = {
            storage: {
              local: {
                get: async (key) => typeof key === 'string' ? { [key]: mockStorage[key] } : mockStorage
              }
            }
          };

          global.window = {};
          global.document = {
            querySelectorAll: () => [{ textContent: 'Test Artist', dataset: {} }],
            querySelector: () => ({ textContent: 'Test Artist', dataset: {} })
          };
          global.ShowWarningBadge = () => {};
          global.ShowHumanBadge = () => {};
          global.ShowNoDataBadge = () => {};

          const fs = require('fs');
          eval(fs.readFileSync('Utils/processCurrentSong.js', 'utf8'));

          async function runTests() {
            let clicked = false;
            const fakeSkip = { click: () => { clicked = true; } };
            global.getLocalStatus = async () => null;

            // TEST 1: Below threshold -> NO SKIP
            global.getArtistStatus = async () => ({ out_ai: 4, out_human: 6, out_verified: false });
            clicked = false;
            await window.DecideBadge(10, 10, 'selector', 'loc', fakeSkip, 0, 'yt');
            console.assert(clicked === false, 'Test 1 Failed: Should not skip below threshold');

            // TEST 2: Above threshold -> SHOULD SKIP
            global.getArtistStatus = async () => ({ out_ai: 8, out_human: 2, out_verified: false });
            clicked = false;
            await window.DecideBadge(10, 10, 'selector', 'loc', fakeSkip, 0, 'yt');
            console.assert(clicked === true, 'Test 2 Failed: Should skip above threshold');

            // TEST 3: Total votes < minVotes -> NO SKIP
            global.getArtistStatus = async () => ({ out_ai: 2, out_human: 0, out_verified: false });
            clicked = false;
            await window.DecideBadge(10, 10, 'selector', 'loc', fakeSkip, 0, 'yt');
            console.assert(clicked === false, 'Test 3 Failed: Should not skip when total votes < minVotes');

            // TEST 4: Whitelisted artist -> NO SKIP
            global.getArtistStatus = async () => ({ out_ai: 10, out_human: 0, out_verified: false });
            global.getLocalStatus = async () => 'white';
            clicked = false;
            await window.DecideBadge(10, 10, 'selector', 'loc', fakeSkip, 0, 'yt');
            console.assert(clicked === false, 'Test 4 Failed: Whitelisted artist should never skip');

            // TEST 5: Blacklisted artist -> SHOULD SKIP
            global.getArtistStatus = async () => ({ out_ai: 0, out_human: 0, out_verified: false });
            global.getLocalStatus = async () => 'black';
            clicked = false;
            await window.DecideBadge(10, 10, 'selector', 'loc', fakeSkip, 0, 'yt');
            console.assert(clicked === true, 'Test 5 Failed: Blacklisted artist should always skip');

            console.log('All DecideBadge skipping decision tests passed successfully!');
          }

          runTests();
          "
