name: SoundProof Extension Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Validate manifest.json syntax
        run: python3 -m json.tool manifest.json > /dev/null
